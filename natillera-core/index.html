<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natillera - Bienvenida</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.1) 0, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        p {
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .login-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: white;
            color: #1e293b;
            text-decoration: none;
            padding: 0.875rem 1.5rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #e2e8f0;
            width: 100%;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            cursor: pointer;
            outline: none;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            background-color: #f8fafc;
        }

        .login-button:active {
            transform: translateY(0);
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Ambient background shapes */
        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.4;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            background: #6366f1;
            top: -100px;
            left: -100px;
        }

        .shape-2 {
            width: 250px;
            height: 250px;
            background: #c084fc;
            bottom: -50px;
            right: -50px;
        }
    </style>
</head>

<body>
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>

    <div class="container">
        <div class="glass-card">
            <div class="logo">Natillera</div>
            <h1>Bienvenido de nuevo</h1>
            <p>Gestiona tus ahorros y préstamos de forma sencilla y segura.</p>

            <form action="http://localhost:7001/app/v1/auth/google" method="POST">
                <button type="submit" class="login-button">
                    <svg class="google-icon" viewBox="0 0 24 24">
                        <path fill="#EA4335"
                            d="M24 12.25c0-.82-.07-1.61-.21-2.38H12v4.51h6.73a5.75 5.75 0 0 1-2.5 3.77v3.13h4.05c2.37-2.18 3.72-5.39 3.72-9.03z" />
                        <path fill="#4285F4"
                            d="M12.25 24c3.24 0 5.96-1.07 7.95-2.91l-3.86-2.99c-1.07.72-2.43 1.15-3.86 1.15-2.96 0-5.46-2.01-6.36-4.7H1.93v3.13C3.91 21.6 7.79 24 12.25 24z" />
                        <path fill="#FBBC05"
                            d="M5.89 14.54a7.22 7.22 0 0 1 0-4.63V6.78H1.93a12.01 12.01 0 0 0 0 10.89l3.96-3.13z" />
                        <path fill="#34A853"
                            d="M12.25 4.75c1.76 0 3.34.61 4.59 1.81l3.43-3.43C18.2 1.19 15.48 0 12.25 0 7.79 0 3.91 2.4 1.93 6.78l3.96 3.13c.9-2.69 3.4-4.7 6.36-4.7z" />
                    </svg>
                    Continuar con Google
                </button>
            </form>
        </div>
    </div>
</body>

</html>
